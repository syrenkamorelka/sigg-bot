name: SIGG Stock Bot

on:
  schedule:
    - cron: '0 12 * * *'  # Uruchamia się codziennie o 13:00 UTC (13:00 czasu polskiego)
  workflow_dispatch:      # Pozwala też włączyć bota ręcznie jednym kliknięciem

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie bota giełdowego
        run: python bot.py
